[package]
name = "zea-codegen"
version = "0.1.0"
edition = "2024"

[dependencies]
zea-ipr = {path = "../zea-ipr"}
zea-internal-macros = { path = "../zea-internal-macros" }
indexmap = {version = "2.14.0", features = ["rayon"]}
log = { version = "0.4.33", features = ["std"] }
cranelift = { version = "0.134.3", features = ["core", "module", "object", "std"] }
target-lexicon = { version = "0.13.5", features = ["std"] }

[lib]
doctest = false
