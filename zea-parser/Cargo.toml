[package]
name = "zea-parser"
version = "0.1.0"
edition = "2024"

[dependencies]
zea-ipr = { path = "../zea-ipr" }
lalrpop-util = { version = "0.23.1", features = ["lexer", "unicode"], optional = true }
log = "0.4.31"
clap = { version = "4.6.2", features = ["derive"] }

[build-dependencies]
lalrpop = { version = "0.23.1", optional = true }


[features]
lalrpop_parser = ["dep:lalrpop", "dep:lalrpop-util"]
zepast = ["zea-ipr/visualisation"]
default = ["lalrpop_parser"]


[lib]
doctest = false
